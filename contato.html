<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Entre em contato com a Agência Weedoo para consultoria em SEO e Business Intelligence.">
    <title>Weedoo - Conecte-se</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css_files/index-styles.css">
</head>

<body>

    <header>
        <div class="container">
            <div class="logo">
                <a href="index.html"><strong>AGÊNCIA WEEDOO</strong></a>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="servicos.html">Serviços</a></li>
                    <li><a href="sobre.html">Sobre nós</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="contact-section">
        <div class="container">
            <div class="form-card">
                <h1>Fale com a Weedoo!</h1>
                <form action="#" method="POST">
                    <div class="input-group">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" name="nome" placeholder="Como devemos te chamar?" required>
                    </div>

                    <div class="input-group">
                        <label for="email">E-mail Profissional</label>
                        <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                    </div>

                    <div class="input-group">
                        <label for="mensagem">Como podemos otimizar seu negócio?</label>
                        <textarea id="mensagem" name="mensagem"
                            placeholder="Descreva seu projeto ou desafio técnico..."></textarea>
                    </div>

                    <button type="submit" class="btn-submit">Enviar Mensagem</button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <p>Agência Weedoo // Conexão via Dados.</p>
    </footer>

</body>

</html>
