<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Entre em contato com a Agência Weedoo para consultoria em SEO e Business Intelligence.">
    <title>Weedoo - Conecte-se</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: #f0f0f0;
            background: radial-gradient(circle at 50% 50%, rgb(42, 14, 74) 0%, rgb(10, 10, 10) 100%);
            background-attachment: fixed;
            min-height: 100vh;
            /* Garante que o conteúdo não cole nas bordas do celular */
            padding: 10px;
        }

        /* Ajuste para Mobile-First: o container ocupa quase tudo no celular */
        .container {
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        header {
            padding: 15px 0;
        }

        /* No Mobile, vamos empilhar a logo e o menu para dar mais espaço */
        header .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: center;
        }

        .logo strong {
            font-size: 1.5em;
            background: linear-gradient(90deg, #00d4ff, #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        nav ul {
            display: flex;
            justify-content: center;
            gap: 15px;
            /* Espaço maior entre links para evitar cliques errados */
            list-style: none;
        }

        nav ul li a {
            text-decoration: none;
            color: #f0f0f0;
            font-size: 0.85em;
            padding: 8px;
            /* Área de toque maior */
        }

        /* Formulário otimizado para o polegar */
        .form-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            padding: 30px 20px;
            /* Menos preenchimento lateral no mobile */
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 20px;
        }

        .form-card h1 {
            font-size: 1.8em;
            /* Fonte menor para não quebrar linha em excesso */
            margin-bottom: 20px;
        }

        .input-group input,
        .input-group textarea {
            font-size: 16px;
            /* DICA DE OURO: No iPhone, se a fonte for < 16px, o navegador dá zoom automático ao clicar, o que estraga a experiência. */
            padding: 15px;
        }

        .btn-submit {
            padding: 20px;
            /* Botão bem alto para o toque */
            font-size: 1.1em;
        }

        /* MEDIA QUERY: Para telas maiores (Desktop), voltamos ao layout original */
        @media (min-width: 768px) {
            header .container {
                flex-direction: row;
                justify-content: space-between;
                text-align: left;
            }

            .form-card {
                padding: 50px;
            }

            .form-card h1 {
                font-size: 2.5em;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>

    <header>
        <div class="container">
            <div class="logo"><strong>WEEDOO</strong></div>
            <nav>
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="servicos.html">Serviços</a></li>
                    <li><a href="sobre.html">Sobre nós</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="contact-section">
        <div class="container">
            <div class="form-card">
                <h1>Fale com a Weedoo!</h1>
                <form action="#" method="POST">
                    <div class="input-group">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" name="nome" placeholder="Como devemos te chamar?" required>
                    </div>

                    <div class="input-group">
                        <label for="email">E-mail Profissional</label>
                        <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                    </div>

                    <div class="input-group">
                        <label for="mensagem">Como podemos otimizar seu negócio?</label>
                        <textarea id="mensagem" name="mensagem"
                            placeholder="Descreva seu projeto ou desafio técnico..."></textarea>
                    </div>

                    <button type="submit" class="btn-submit">Enviar Mensagem</button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <p>Agência Weedoo // Conexão via Dados.</p>
    </footer>

</body>

</html>
